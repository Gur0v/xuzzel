[package]
name = "xuzzel"
version = "0.1.0"
edition = "2021"
description = "A fuzzel-inspired launcher for X11"
license = "GPL-3.0-or-later"

[[bin]]
name = "xuzzel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cairo-rs = { version = "0.20", features = ["xlib"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
freedesktop-icons = "0.4"
image = "0.25"
libc = "0.2"
once_cell = "1.21"
pango = "0.20"
pangocairo = "0.20"
resvg = "0.47"
serde = { version = "1.0", features = ["derive"] }
shlex = "1.3"
toml = "0.8"
which = "8.0"
