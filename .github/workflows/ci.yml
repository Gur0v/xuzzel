name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libx11-dev \
            libxft-dev \
            libfontconfig1-dev \
            libxinerama-dev \
            libcairo2-dev \
            libpng-dev

      - name: Verify pkg-config dependencies
        run: pkg-config --exists x11 xft fontconfig xinerama cairo-xlib libpng

      - name: Build
        run: make -j2

      - name: Test
        run: make check

      - name: Sanitizers
        run: make sanitize
