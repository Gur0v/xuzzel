name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxft-dev libfontconfig1-dev libxinerama-dev
      - run: make -j2
      - run: make check
      - run: make sanitize
